<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0b12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/favicon.png" type="image/png">
<title>Game Space · 游戏中</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=ZCOOL+QingKe+HuangYou&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05060b;--panel:#0e1020;--panel2:#171a2c;--ink:#ecebfa;--dim:#8b88ae;
  --line:rgba(150,158,255,.14);--magenta:#ff2e88;--cyan:#22e3ff;--amber:#ffcf4a;--lime:#9dff5b;
  --pixel:'Silkscreen','Courier New',monospace;--cjk:'ZCOOL QingKe HuangYou','PingFang SC','Microsoft YaHei',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--cjk);overflow:hidden}
button,a{font-family:inherit}
.shell{height:100dvh;display:flex;flex-direction:column;background:radial-gradient(130% 90% at 50% -20%,#171a33 0%,var(--bg) 58%)}

.bar{
  flex:0 0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:10px clamp(10px,2.4vw,24px);background:rgba(10,11,18,.86);
  border-bottom:1px solid var(--line);backdrop-filter:blur(14px);z-index:5
}
.back{
  color:var(--dim);text-decoration:none;font-family:var(--pixel);font-size:.62rem;
  letter-spacing:.06em;padding:9px 12px;border:1px solid var(--line);border-radius:9px;white-space:nowrap
}
.back:hover{color:var(--cyan);border-color:var(--cyan)}
.title{flex:1;min-width:120px;line-height:1.2}
.title b{font-size:clamp(1.1rem,3.4vw,1.6rem);font-weight:400;letter-spacing:.05em}
.title small{display:block;font-family:var(--pixel);font-size:.56rem;color:var(--dim);letter-spacing:.1em;margin-top:5px}
.actions{display:flex;gap:7px;flex-wrap:wrap}
.actions button{
  background:rgba(150,158,255,.06);color:var(--ink);border:1px solid var(--line);
  border-radius:9px;padding:9px 12px;font-size:.86rem;letter-spacing:.04em;cursor:pointer;
  transition:.18s;white-space:nowrap
}
.actions button:hover{border-color:var(--cyan);color:var(--cyan);transform:translateY(-1px)}
.actions button.primary{background:var(--magenta);border-color:var(--magenta);color:#05060b;font-weight:700}
.actions button.primary:hover{background:var(--lime);border-color:var(--lime);color:#05060b}

.stage{position:relative;flex:1;min-height:0;margin:clamp(8px,1.6vw,18px) clamp(8px,1.6vw,18px) 0;border-radius:14px;overflow:hidden;background:#000;border:1px solid var(--line)}
.stage:fullscreen{margin:0;border-radius:0}
iframe{display:block;width:100%;height:100%;border:0;background:#000}
.veil{
  position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:18px;text-align:center;padding:28px;background:rgba(5,6,11,.86);backdrop-filter:blur(8px)
}
.veil[hidden]{display:none}
.veil .big{font-family:var(--pixel);font-size:clamp(1.8rem,7vw,3.4rem);letter-spacing:.12em;color:var(--amber);text-shadow:0 0 28px rgba(255,207,74,.45)}
.veil .desc{font-size:1.1rem;color:var(--dim);max-width:38ch;line-height:1.7}
.veil .row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.veil button,.veil a{
  background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:10px;
  padding:12px 20px;text-decoration:none;font-size:1rem;cursor:pointer;transition:.18s
}
.veil button:hover,.veil a:hover{border-color:var(--cyan);color:var(--cyan)}
.veil .go{background:var(--lime);border-color:var(--lime);color:#05060b;font-weight:700}
.veil .go:hover{background:var(--cyan);border-color:var(--cyan);color:#05060b}
.scorebox{font-family:var(--pixel);font-size:.7rem;color:var(--lime);background:rgba(157,255,91,.07);border:1px solid rgba(157,255,91,.22);border-radius:10px;padding:12px 18px;max-width:90%;word-break:break-all}

.touch{display:none;flex:0 0 auto;gap:8px;justify-content:center;padding:10px clamp(8px,2vw,20px) calc(10px + env(safe-area-inset-bottom))}
.touch button{
  width:56px;height:52px;border-radius:13px;border:1px solid var(--line);
  background:rgba(150,158,255,.06);color:var(--cyan);font-family:var(--pixel);font-size:1rem;cursor:pointer;touch-action:manipulation
}
.touch button:active{background:var(--cyan);color:#05060b}
.touch .spacer{width:22px}
@media (pointer:coarse){.touch{display:flex}}

.foot{
  flex:0 0 auto;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;
  padding:8px clamp(10px,2.4vw,24px) calc(8px + env(safe-area-inset-bottom));
  font-family:var(--pixel);font-size:.55rem;letter-spacing:.07em;color:var(--dim);
  border-top:1px solid var(--line)
}
.foot b{color:var(--lime);font-weight:400}
@media (max-width:640px){.title small{display:none}.actions button{padding:8px 10px;font-size:.8rem}.foot{font-size:.5rem}}
</style>
</head>
<body>
<div class="shell">
  <header class="bar">
    <a class="back" href="/">← ARCADE</a>
    <div class="title"><b id="gameName">载入中…</b><small id="gameMeta">GAME SPACE / PLAYER ONE READY</small></div>
    <div class="actions">
      <button data-act="save" title="立刻写入本地存档">存档</button>
      <button data-act="load" title="读取上一次本地存档">读档</button>
      <button data-act="pause" title="暂停 / 继续">暂停</button>
      <button data-act="mute" title="静音 / 恢复">静音</button>
      <button data-act="full" title="全屏">全屏</button>
      <button data-act="finish" class="primary">结算</button>
    </div>
  </header>

  <div class="stage" id="stage">
    <iframe id="frame" title="游戏画面" allow="autoplay; fullscreen" referrerpolicy="strict-origin-when-cross-origin"></iframe>
    <div class="veil" id="pauseVeil" hidden>
      <div class="big">PAUSED</div>
      <div class="desc">进度已自动保存，回来接着玩。</div>
      <div class="row"><button class="go" data-act="resume">继续游戏</button><a href="/">返回街机厅</a></div>
    </div>
    <div class="veil" id="resultVeil" hidden>
      <div class="big">ROUND OVER</div>
      <div class="scorebox" id="resultInfo"></div>
      <div class="desc">把这一局存到云端，换设备也能接着玩。</div>
      <div class="row"><button class="go" data-act="cloud">存到云端</button><button data-act="resume">继续游戏</button></div>
    </div>
  </div>

  <div class="touch" id="touch" aria-label="虚拟按键">
    <button data-key="ArrowLeft">◀</button><button data-key="ArrowUp">▲</button><button data-key="ArrowDown">▼</button><button data-key="ArrowRight">▶</button>
    <span class="spacer"></span><button data-key="KeyZ">Z</button><button data-key="KeyX">X</button>
  </div>

  <footer class="foot">
    <span>自动存档 <b id="saveState">每 30 秒</b> · 最近存档 <b id="saveTime">—</b></span>
    <span id="cloudState">本地模式 · 登录后同步云端</span>
  </footer>
</div>

<script src="/assets/games.js?v=1"></script>
<script src="/assets/core.js?v=1"></script>
<script>
(function(){
  'use strict';
  const C = window.GS_CORE, G = window.GS;
  const frame = document.getElementById('frame');
  const stage = document.getElementById('stage');
  const pauseVeil = document.getElementById('pauseVeil');
  const resultVeil = document.getElementById('resultVeil');
  const saveTime = document.getElementById('saveTime');
  const saveState = document.getElementById('saveState');
  const cloudState = document.getElementById('cloudState');

  function currentDir(){
    const m = location.pathname.match(/\/play\/([^/]+)\/?$/);
    if (m) { try { return decodeURIComponent(m[1]); } catch(e){} }
    return new URLSearchParams(location.search).get('g') || '';
  }

  const dir = currentDir();
  const num = Number((dir.match(/^(\d+)-/) || [])[1] || 0);
  const game = G.find(num);
  const gameId = dir || String(num);
  const saveKey = 'save_' + gameId;

  document.getElementById('gameName').textContent = game ? G.disp(game[1]) : (dir || '未知游戏');
  document.title = (game ? G.disp(game[1]) : '游戏') + ' · Game Space';
  document.getElementById('gameMeta').textContent = game ? ('#' + String(num).padStart(2,'0') + ' / ' + game[2] + ' · GAME SPACE') : 'GAME SPACE';

  if (!/^\d+-/.test(dir)) {
    document.getElementById('resultInfo').textContent = '未找到指定游戏';
    resultVeil.hidden = false;
    return;
  }

  if (C.auth.isLogged()) {
    const u = C.auth.user();
    cloudState.textContent = '已登录 · ' + (u && u.email ? u.email : '云端同步已开启');
  }

  function collect(){
    const data = {};
    try {
      const w = frame.contentWindow;
      for (let i=0; i<w.localStorage.length; i++) {
        const k = w.localStorage.key(i);
        if (k && k.indexOf('gs_') !== 0 && k.indexOf('save_') !== 0) data[k] = w.localStorage.getItem(k);
      }
    } catch(e){}
    return data;
  }

  function restore(data){
    if (!data || typeof data !== 'object') return;
    Object.keys(data).forEach(k => {
      if (k.indexOf('gs_') === 0 || k.indexOf('save_') === 0) return;
      try { localStorage.setItem(k, String(data[k])); } catch(e){}
    });
  }

  function saveLocal(silent){
    const record = { game: gameId, data: collect(), saved_at: new Date().toISOString() };
    C.setJSON(saveKey, record);
    saveTime.textContent = C.fmtDate(Date.now()).slice(-8);
    saveState.textContent = '已保存';
    if (!silent) C.toast('进度已存到本地');
    return record;
  }

  function loadLocal(){
    const record = C.getJSON(saveKey, null);
    if (!record) { C.toast('还没有本地存档'); return; }
    restore(record.data);
    C.toast('已读取存档 · 重新载入游戏生效');
    setTimeout(() => { frame.src = frame.src; }, 300);
  }

  const initial = C.getJSON(saveKey, null);
  if (initial) { restore(initial.data); saveTime.textContent = C.fmtDate(new Date(initial.saved_at).getTime()).slice(-8); }

  frame.src = '/' + dir + '/index.html';
  frame.addEventListener('load', () => {
    C.recent.add(dir, G.disp(game ? game[1] : dir));
    C.track('play', { game: gameId });
  });

  setInterval(() => saveLocal(true), 30000);
  addEventListener('pagehide', () => saveLocal(true));

  async function cloudSave(){
    const record = saveLocal(true);
    if (!C.auth.isLogged()) {
      C.toast('先登录，才能存到云端');
      location.href = '/dashboard/?next=' + encodeURIComponent(location.pathname);
      return;
    }
    try {
      await C.api.save(gameId, record.data);
      cloudState.textContent = '已同步到云端 · ' + C.fmtDate(Date.now()).slice(-8);
      C.toast('已存到云端');
    } catch (e) {
      C.toast('云端暂不可用：' + e.message);
    }
  }

  function sendKey(code){
    const key = ({ ArrowLeft:'ArrowLeft', ArrowUp:'ArrowUp', ArrowDown:'ArrowDown', ArrowRight:'ArrowRight', KeyZ:'z', KeyX:'x' })[code] || code;
    const init = { key, code, bubbles:true, cancelable:true };
    try {
      const doc = frame.contentDocument;
      doc.dispatchEvent(new KeyboardEvent('keydown', init));
      setTimeout(() => doc.dispatchEvent(new KeyboardEvent('keyup', init)), 110);
    } catch(e){}
  }

  document.addEventListener('click', async e => {
    const btn = e.target.closest('[data-act]');
    if (!btn) return;
    const act = btn.dataset.act;
    if (act === 'save') saveLocal(false);
    if (act === 'load') loadLocal();
    if (act === 'cloud') { await cloudSave(); resultVeil.hidden = true; }
    if (act === 'pause' || act === 'resume') {
      pauseVeil.hidden = act === 'resume';
      resultVeil.hidden = true;
    }
    if (act === 'finish') {
      saveLocal(true);
      const rec = C.getJSON(saveKey, {});
      document.getElementById('resultInfo').textContent = gameId + ' · 本地存档 ' + (rec.saved_at ? C.fmtDate(new Date(rec.saved_at).getTime()) : '—');
      resultVeil.hidden = false;
      C.track('finish', { game: gameId });
    }
    if (act === 'mute') {
      try {
        const doc = frame.contentDocument;
        const media = doc.querySelectorAll('audio,video');
        const next = !btn.dataset.muted;
        media.forEach(m => { m.muted = next; });
        btn.dataset.muted = next ? '1' : '';
        btn.textContent = next ? '恢复' : '静音';
        C.toast(next ? '已静音' : '声音已恢复');
      } catch(err) { C.toast('该游戏不支持外部静音'); }
    }
    if (act === 'full') {
      if (document.fullscreenElement) document.exitFullscreen();
      else if (stage.requestFullscreen) stage.requestFullscreen();
      else C.toast('当前浏览器不支持全屏');
    }
  });

  document.getElementById('touch').addEventListener('pointerdown', e => {
    const btn = e.target.closest('[data-key]');
    if (btn) sendKey(btn.dataset.key);
  });
})();
</script>
</body>
</html>
