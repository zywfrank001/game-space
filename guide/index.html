*{margin:0;padding:0;box-sizing:border-box}body{background:radial-gradient(120% 80% at 50% -10%,#171a33,var(--bg) 55%);color:var(--ink);font-family:var(--cjk);min-height:100vh}

.item{display:flex;align-items:center;gap:18px;padding:22px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(160deg,var(--panel),var(--bg));text-decoration:none;transition:.2s}
.item:hover{border-color:var(--cyan);transform:translateY(-3px)}
.item .no{font-family:var(--pixel);font-size:1.3rem;color:var(--amber)}
.item .tx{flex:1}.item b{font-size:1.25rem;font-weight:400}.item small{display:block;color:var(--dim);margin-top:6px;line-height:1.6}
.item .go{color:var(--lime);font-size:1.4rem}
