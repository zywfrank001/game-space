<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>404 · Game Space</title>
<link rel="icon" href="/favicon.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen&family=ZCOOL+QingKe+HuangYou&display=swap" rel="stylesheet">
<style>
:root{--bg:#05060b;--ink:#ecebfa;--dim:#8b88ae;--line:rgba(150,158,255,.14);--magenta:#ff2e88;--cyan:#22e3ff;--cjk:'ZCOOL QingKe HuangYou','PingFang SC','Microsoft YaHei',sans-serif;--pixel:'Silkscreen',monospace}
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;background:radial-gradient(120% 80% at 50% -10%,#171a33,var(--bg) 55%);color:var(--ink);font-family:var(--cjk);padding:24px}
.box{max-width:520px}
.code{font-family:var(--pixel);font-size:clamp(5rem,22vw,10rem);line-height:1;color:var(--magenta);text-shadow:0 0 40px rgba(255,46,136,.4)}
h1{font-size:clamp(1.5rem,5vw,2.2rem);font-weight:400;margin:20px 0 12px}
p{color:var(--dim);line-height:1.9;margin-bottom:30px}
a{display:inline-block;padding:14px 26px;border:1px solid var(--line);border-radius:11px;color:var(--cyan);text-decoration:none;transition:.2s}
a:hover{border-color:var(--cyan);background:rgba(34,227,255,.07)}
</style>
</head>
<body>
<div class="box">
  <div class="code">404</div>
  <h1>这里没有游戏</h1>
  <p>也许链接敲错了，也许这款游戏被搬走了。<br>回街机厅看看，60 款都还在。</p>
  <a href="/">← 返回街机厅</a>
</div>
</body>
</html>
